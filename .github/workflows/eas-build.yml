name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile (preview = direct APK, production = Play Store/App Store)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build:
    name: EAS Build (${{ inputs.platform || 'android' }} / ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 Typecheck project
        run: npm run typecheck

      - name: 🚀 Run EAS Build
        run: |
          eas build \
            --platform ${{ inputs.platform || 'android' }} \
            --profile ${{ inputs.profile || 'preview' }} \
            --non-interactive
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
